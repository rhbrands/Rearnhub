<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - RearnHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Login</h2>

  <!-- Inline message container -->
  <div id="message" class="message"></div>

  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>

  <button id="loginBtn">Login</button>

  <p>No account? <a href="register.html">Register</a></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDUuzw189X97PKegWApVMTUEY5AJC6F5r8",
    authDomain: "rearnhub.firebaseapp.com",
    projectId: "rearnhub",
    storageBucket: "rearnhub.firebasestorage.app",
    messagingSenderId: "461077159495",
    appId: "1:461077159495:web:595412074b4c28de17db62"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const loginBtn = document.getElementById("loginBtn");
  const messageDiv = document.getElementById("message");

  // Auto redirect if already logged in
  onAuthStateChanged(auth, user => {
    if (user) window.location.href = "dashboard.html";
  });

  loginBtn.addEventListener("click", () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
      messageDiv.textContent = "Enter email and password";
      messageDiv.className = "message error";
      messageDiv.style.display = "block";
      return;
    }

    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        messageDiv.textContent = "Login successful!";
        messageDiv.className = "message success";
        messageDiv.style.display = "block";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      })
      .catch(error => {
        messageDiv.textContent = error.message;
        messageDiv.className = "message error";
        messageDiv.style.display = "block";
      });
  });
</script>

</body>
</html>
