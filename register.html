<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - RearnHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Register</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="registerBtn" class="task-btn">Register</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, doc, setDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const BASE_PATH = "/Rearnhub"; // Important for GitHub Pages

const firebaseConfig = {
  apiKey: "AIzaSyDUuzw189X97PKegWApVMTUEY5AJC6F5r8",
  authDomain: "rearnhub.firebaseapp.com",
  projectId: "rearnhub",
  storageBucket: "rearnhub.firebasestorage.app",
  messagingSenderId: "461077159495",
  appId: "1:461077159495:web:595412074b4c28de17db62"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("registerBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if(!email || !password) { alert("Enter email and password"); return; }

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const uid = userCredential.user.uid;
    const userDocRef = doc(db, "users", uid);
    await setDoc(userDocRef, { points: 0, completedTasks: [], referralCount: 0 });

    // Referral tracking
    const urlParams = new URLSearchParams(window.location.search);
    const refId = urlParams.get('ref');
    if(refId && refId !== uid) {
      const refDocRef = doc(db, "users", refId);
      const refSnap = await getDoc(refDocRef);
      if(refSnap.exists()) {
        await updateDoc(refDocRef, {
          referralCount: (refSnap.data().referralCount || 0) + 1
        });
      }
    }

    // Redirect to dashboard
    window.location.href = `${BASE_PATH}/dashboard.html`;

  } catch(err) {
    alert(err.message);
  }
});
</script>

</body>
</html>
