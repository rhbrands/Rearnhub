<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - RearnHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="dashboard-header">
    <div class="user-name" id="welcome"></div>
    <div class="site-name">RearnHub</div>
  </header>

  <!-- ACCOUNT BALANCE SECTION -->
  <section class="account-balance">
    <h2>Account Balance</h2>
    <div class="balance-cards">
      <div class="balance-card">
        <h3>Task Balance</h3>
        <p id="taskBalance">0</p>
      </div>
      <div class="balance-card">
        <h3>Referral Balance</h3>
        <p id="refBalance">0</p>
      </div>
      <div class="balance-card total">
        <h3>Total Balance</h3>
        <p id="totalBalance">0</p>
      </div>
    </div>
  </section>

  <!-- REFERRAL SECTION -->
  <section class="referral-section">
    <h2>Referral</h2>
    <p>Earn #1000.00 for each referral</p>
    <p>Referral link:</p>
    <input type="text" id="refLink" readonly>
    <p>Referral count: <span id="refCount">0</span></p>
  </section>

  <!-- TASKS SECTION -->
  <section class="tasks-section">
    <h2>Tasks</h2>
    <ul id="tasksList">
      <li><button id="task1Btn">Read Article (+10 pts)</button></li>
      <li><button id="task2Btn">Watch Video (+15 pts)</button></li>
    </ul>
  </section>

  <button id="logoutBtn" class="logout-btn">Logout</button>

  <!-- Scripts -->
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/tasks.js"></script>
</body>
</html>
