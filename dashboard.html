<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - RearnHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Welcome to RearnHub Dashboard</h2>

  <!-- Points Display -->
  <p>Your Points: <span id="points">0</span></p>

  <!-- Available Tasks Section -->
  <div id="tasks-section">
    <h3>Available Tasks</h3>
    <div id="tasks">
      <!-- Task 1 -->
      <div class="task-item" data-taskid="task1">
        <p>Task 1: Join RearnHub Telegram</p>
        <a href="https://t.me/YourTelegramChannel" target="_blank" class="task-link">Go to Telegram</a>
        <button class="task-btn" data-points="10" disabled>Mark as Complete</button>
      </div>

      <!-- Task 2 -->
      <div class="task-item" data-taskid="task2">
        <p>Task 2: Complete Task 2</p>
        <button class="task-btn" data-points="20">Mark as Complete</button>
      </div>

      <!-- Task 3 -->
      <div class="task-item" data-taskid="task3">
        <p>Task 3: Complete Task 3</p>
        <button class="task-btn" data-points="30">Mark as Complete</button>
      </div>
    </div>
  </div>

  <!-- Completed Tasks Section -->
  <div id="completed-section">
    <h3>Completed Tasks</h3>
    <div id="completed-tasks"></div>
  </div>

  <button id="logoutBtn">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } 
  from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } 
  from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUuzw189X97PKegWApVMTUEY5AJC6F5r8",
  authDomain: "rearnhub.firebaseapp.com",
  projectId: "rearnhub",
  storageBucket: "rearnhub.firebasestorage.app",
  messagingSenderId: "461077159495",
  appId: "1:461077159495:web:595412074b4c28de17db62"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const pointsSpan = document.getElementById("points");
const tasksDiv = document.getElementById("tasks");
const logoutBtn = document.getElementById("logoutBtn");

let userId = null;

// Check login and load points + completed tasks
onAuthStateChanged(auth, async user => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }
  userId = user.uid;

  const userDocRef = doc(db, "users", userId);
  const docSnap = await getDoc(userDocRef);

  if (docSnap.exists()) {
    pointsSpan.textContent = docSnap.data().points;
    const completed = docSnap.data().completedTasks || [];

    // Move completed tasks to completed section
    completed.forEach(taskId => {
      const taskDiv = document.querySelector(`.task-item[data-taskid="${taskId}"]`);
      if (taskDiv) moveToCompleted(taskDiv);
    });
  } else {
    await setDoc(userDocRef, { points: 0, completedTasks: [] });
    pointsSpan.textContent = 0;
  }
});

// Function to move task to completed section
function moveToCompleted(taskDiv) {
  const completedTasksDiv = document.getElementById("completed-tasks");
  taskDiv.querySelector(".task-btn")?.remove(); // remove button
  completedTasksDiv.appendChild(taskDiv);
}

// Enable Task 1 button only after clicking the Telegram link
const telegramLinks = document.querySelectorAll(".task-link");
telegramLinks.forEach(link => {
  link.addEventListener("click", () => {
    const taskDiv = link.closest(".task-item");
    const button = taskDiv.querySelector(".task-btn");
    button.disabled = false;
  });
});

// Task completion listener
tasksDiv.addEventListener("click", async e => {
  if (!e.target.classList.contains("task-btn")) return;
  const button = e.target;
  const taskDiv = button.closest(".task-item");
  const taskId = taskDiv.dataset.taskid;
  const pointsToAdd = parseInt(button.dataset.points);
  if (!userId) return;

  const userDocRef = doc(db, "users", userId);
  const isTelegramTask = taskDiv.querySelector(".task-link") !== null;

  const completeTask = async () => {
    // Update points and completed tasks array
    await updateDoc(userDocRef, {
      points: (parseInt(pointsSpan.textContent) || 0) + pointsToAdd,
      completedTasks: arrayUnion(taskId)
    });

    pointsSpan.textContent = parseInt(pointsSpan.textContent) + pointsToAdd;
    moveToCompleted(taskDiv);
  };

  if (isTelegramTask) {
    // Telegram task 5-second delay
    button.disabled = true;
    let countdown = 5;
    const originalText = button.textContent;
    button.textContent = `Completing... ${countdown}s`;

    const interval = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        button.textContent = `Completing... ${countdown}s`;
      } else {
        clearInterval(interval);
        completeTask().catch(err => {
          button.textContent = originalText;
          button.disabled = false;
          alert("Error updating points: " + err.message);
        });
      }
    }, 1000);
  } else {
    // Other tasks: instant
    completeTask().catch(err => alert("Error updating points: " + err.message));
  }
});

// Logout
logoutBtn.addEventListener("click", () => {
  signOut(auth).then(() => window.location.href = "login.html");
});
</script>

</body>
</html>
