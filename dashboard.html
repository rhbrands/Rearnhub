<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - RearnHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>RearnHub Dashboard</h1>
  </header>

  <main>
    <p id="welcome"></p>
    <p>Your points: <span id="points">0</span></p>

    <h3>Tasks</h3>
    <ul id="tasksList">
      <li><button id="task1Btn">Read Article (+10 pts)</button></li>
      <li><button id="task2Btn">Watch Video (+15 pts)</button></li>
    </ul>

    <p>Share your referral link: <span id="refLink"></span></p>

    <button id="logoutBtn">Logout</button>
  </main>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/tasks.js"></script>
</body>
</html>
