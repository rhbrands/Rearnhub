<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | RearnHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="dashboard-header">
    <div class="site-name">RearnHub</div>
    <div class="user-info">
      <span id="userFullName"></span>
    </div>
  </header>

  <main class="dashboard-main">
    <p>Welcome to your dashboard!</p>
    <p>Here you will see your tasks and rewards.</p>

    <!-- Account Balance Section -->
<section class="dashboard-section balance-section">
  <h2>Available Balance</h2>
  <p class="balance-amount">#</p>
</section>

<!-- Refer Section -->
<section class="dashboard-section refer-section">
  <h2>Refer & Earn</h2>
  <p>Your referral link:</p>
  <input type="text" id="referLink" readonly />

  <p>Total Referrals: <span id="referCount">0</span></p>
  <p class="refer-instructions">
    Earn $1 for every person who signs up using your referral link!
  </p>
</section>

    <!-- ----------------------
Tasks Section
---------------------- -->
<section class="dashboard-section tasks-section">
  <h2>Tasks</h2>
  <p>Click below to do tasks and earn rewards!</p>
  <button id="tasksBtn" class="btn btn-primary">Go to Tasks</button>
</section>


    <button id="logoutBtn" class="btn btn-outline">Logout</button>
  </main>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
