<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - RearnHub</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="container">
  <h2>Welcome to RearnHub Dashboard</h2>
  <p>Your Points: <span id="points">0</span></p>

  <!-- Referral Section -->
  <div id="referral-section">
    <h3>Refer & Earn</h3>
    <p>Earn #1000.00 for each referral!</p>
    <p>Your Referral Link:</p>
    <input type="text" id="referralLinkInput" readonly>
    <p>Referral Count: <span id="referralCount">0</span></p>
  </div>

  <!-- Tasks -->
  <div id="tasks-section">
    <h3>Available Tasks</h3>
    <div id="tasks"></div>
  </div>

  <!-- Completed Tasks -->
  <div id="completed-section">
    <h3>Completed Tasks</h3>
    <div id="completed-tasks"></div>
  </div>

  <button id="logoutBtn">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUuzw189X97PKegWApVMTUEY5AJC6F5r8",
  authDomain: "rearnhub.firebaseapp.com",
  projectId: "rearnhub",
  storageBucket: "rearnhub.firebasestorage.app",
  messagingSenderId: "461077159495",
  appId: "1:461077159495:web:595412074b4c28de17db62"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const pointsSpan = document.getElementById("points");
const tasksDiv = document.getElementById("tasks");
const logoutBtn = document.getElementById("logoutBtn");
const completedDiv = document.getElementById("completed-tasks");
const referralInput = document.getElementById("referralLinkInput");
const referralCountSpan = document.getElementById("referralCount");

let userId = null;

const tasksList = [
  { id: "task1", title: "Join RearnHub Telegram", type: "link", points: 10, link: "https://t.me/YourTelegramChannel", icon: "https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" },
  { id: "task2", title: "Follow RearnHub on Twitter", type: "link", points: 15, link: "https://twitter.com/RearnHub", icon: "https://upload.wikimedia.org/wikipedia/en/6/60/Twitter_Logo_as_of_2021.svg" },
  { id: "task3", title: "Join Discord Server", type: "link", points: 20, link: "https://discord.gg/YourDiscord", icon: "https://upload.wikimedia.org/wikipedia/commons/9/98/Discord_logo.svg" },
  { id: "task4", title: "Follow Instagram", type: "link", points: 12, link: "https://instagram.com/RearnHub", icon: "https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" },
  { id: "task5", title: "Complete Task 5", type: "normal", points: 25 }
];

function renderTasks(completedTasks=[]) {
  tasksDiv.innerHTML = "";
  tasksList.forEach(task => {
    if(completedTasks.includes(task.id)) return;
    const taskDiv = document.createElement("div");
    taskDiv.classList.add("task-item");
    taskDiv.dataset.taskid = task.id;

    let html = `<p>${task.title}</p>`;
    if(task.type === "link") {
      taskDiv.classList.add("link-task");
      html += `<a href="${task.link}" target="_blank" class="task-link">
                 ${task.icon ? `<img src="${task.icon}" class="icon" alt="">` : ""} ${task.title}
               </a>`;
      html += `<button class="task-btn" data-points="${task.points}" disabled>Mark as Complete</button>`;
    } else {
      html += `<button class="task-btn" data-points="${task.points}">Mark as Complete</button>`;
    }
    taskDiv.innerHTML = html;
    tasksDiv.appendChild(taskDiv);
  });
}

function moveToCompleted(taskDiv) {
  taskDiv.querySelector(".task-btn")?.remove();
  completedDiv.appendChild(taskDiv);
}

async function handleTaskCompletion(button) {
  const taskDiv = button.closest(".task-item");
  const taskId = taskDiv.dataset.taskid;
  const task = tasksList.find(t => t.id === taskId);
  const pointsToAdd = task.points;
  if(!userId) return;
  const userDocRef = doc(db, "users", userId);

  const completeTask = async () => {
    await updateDoc(userDocRef, {
      points: (parseInt(pointsSpan.textContent) || 0) + pointsToAdd,
      completedTasks: arrayUnion(taskId)
    });
    pointsSpan.textContent = parseInt(pointsSpan.textContent) + pointsToAdd;
    moveToCompleted(taskDiv);
  };

  if(task.type === "link") {
    button.disabled = true;
    let countdown = 5;
    const originalText = button.textContent;
    button.textContent = `Completing... ${countdown}s`;
    const interval = setInterval(() => {
      countdown--;
      if(countdown > 0) button.textContent = `Completing... ${countdown}s`;
      else {
        clearInterval(interval);
        completeTask().catch(err => {
          button.textContent = originalText;
          button.disabled = false;
          alert("Error updating points: " + err.message);
        });
      }
    }, 1000);
  } else {
    completeTask().catch(err => alert("Error updating points: " + err.message));
  }
}

tasksDiv.addEventListener("click", e => {
  if(e.target.classList.contains("task-link")) {
    const taskDiv = e.target.closest(".task-item");
    const button = taskDiv.querySelector(".task-btn");
    if(button) button.disabled = false;
  }
  if(e.target.classList.contains("task-btn")) handleTaskCompletion(e.target);
});

logoutBtn.addEventListener("click", () => {
  signOut(auth).then(() => window.location.href = "/Rearnhub/login.html");
});

onAuthStateChanged(auth, async user => {
  if(!user) window.location.href = "/Rearnhub/login.html";
  else {
    userId = user.uid;
    const userDocRef = doc(db, "users", userId);
    const docSnap = await getDoc(userDocRef);

    if(docSnap.exists()) {
      pointsSpan.textContent = docSnap.data().points;
      let referralLink = docSnap.data()?.referralLink;
      if(!referralLink) {
        referralLink = `${window.location.origin}/Rearnhub/register.html?ref=${user.uid}`;
        await updateDoc(userDocRef, { referralLink, referralCount: 0 });
      }
      referralInput.value = referralLink;
      referralCountSpan.textContent = docSnap.data()?.referralCount || 0;

      const completed = docSnap.data().completedTasks || [];
      completed.forEach(taskId => {
        const taskDiv = document.querySelector(`.task-item[data-taskid="${taskId}"]`);
        if(taskDiv) moveToCompleted(taskDiv);
      });

      renderTasks(completed);
    } else {
      await setDoc(userDocRef, { points: 0, completedTasks: [], referralLink: `${window.location.origin}/Rearnhub/register.html?ref=${user.uid}`, referralCount: 0 });
      pointsSpan.textContent = 0;
      referralInput.value = `${window.location.origin}/Rearnhub/register.html?ref=${user.uid}`;
      referralCountSpan.textContent = 0;
      renderTasks();
    }
  }
});
</script>
</body>
</html>
