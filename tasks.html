<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks | RearnHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="dashboard-header">
    <div class="site-name">RearnHub</div>
    <div class="user-info">
      <span id="userFullName"></span>
    </div>
  </header>

  <main class="dashboard-main">
  <h1>Available Tasks</h1>
  <p>Complete tasks to earn rewards.</p>

  <!-- Video Tasks -->
  <section class="tasks-category">
    <h2>📺 Video Tasks</h2>

    <div class="task-card" data-task-id="video1" data-reward="200">
      <h3>Watch Intro Video</h3>
      <p>Watch a short video and earn ₦200</p>
      <button class="btn btn-primary">Do Task</button>
    </div>
  </section>

  <!-- Social Tasks -->
  <section class="tasks-category">
    <h2>📣 Social Tasks</h2>

    <div class="task-card" data-task-id="social1" data-reward="300">
      <h3>Share on WhatsApp</h3>
      <p>Share our link and earn ₦300</p>
      <button class="btn btn-primary">Do Task</button>
    </div>
  </section>

  <!-- Simple Tasks -->
  <section class="tasks-category">
    <h2>🧠 Simple Tasks</h2>

    <div class="task-card" data-task-id="simple1" data-reward="100">
      <h3>Daily Login</h3>
      <p>Login today and earn ₦100</p>
      <button class="btn btn-primary">Do Task</button>
    </div>
  </section>

  <button id="backDashboardBtn" class="btn btn-outline" style="margin-top: 20px;">
    Back to Dashboard
  </button>
</main>

  <script type="module" src="tasks.js"></script>
</body>
</html>
